# 1. Frontend
services:
  frontend:
    build: ./container1-frontend
    ports:
      - "3000:3000"
    depends_on:
      - embedding
    networks:
      - vector-redis-net
      
  # 2. Backend:
  embedding:
    build:
      context: ./container1-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - redis 
    volumes:
      - ~/.towhee:/root/.towhee
      - ./container1-backend/uploads:/app/uploads
      - ./container1-backend/service_account.json:/app/service_account.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_HOST=redis
      - CELERY_BROKER_PORT=6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account.json
    networks:
      - vector-redis-net
    command: ["python", "app.py"]

  # 3. Celery Worker: 
  celery-worker:
    build:
      context: ./container1-backend
      dockerfile: Dockerfile
    depends_on:
      - redis 
    volumes:
      - ~/.towhee:/root/.towhee
      - ./container1-backend/uploads:/app/uploads
      - ./container1-backend/service_account.json:/app/service_account.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_HOST=redis
      - CELERY_BROKER_PORT=6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account.json
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=info", "-P", "solo"]
    networks:
      - vector-redis-net

  # 4. Redis:
  redis:
    image: redis/redis-stack-server:latest 
    ports:
      - "6379:6379" 
    volumes:
      - redis_data:/data
    networks:
      - vector-redis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  vector-redis-net:
    driver: bridge

volumes:
  redis_data: